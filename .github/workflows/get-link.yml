name: Get Video Link
on: [workflow_dispatch]

jobs:
  get-link:
    runs-on: ubuntu-latest
    steps:
      - name: Run yt-dlp
        run: |
          pip install yt-dlp
          yt-dlp -g \
            --no-check-certificate \
            --add-header "Referer:https://www.facebook.com" \
            --add-header "User-Agent:Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1" \
            --add-header "Accept:*/*" \
            --add-header "Accept-Language:vi-VN,vi;q=0.9" \
            "https://scontent-sin2-8-xx.fbcdn.cloud/o2/v/t2/f2/m366/42e287ca-40e7-4ffd-bb5d-6a1ec014f404.m3u8"
