name: Get Video Link
on: [workflow_dispatch]

jobs:
  get-link:
    runs-on: ubuntu-latest
    steps:
      - name: Run yt-dlp
        run: |
          pip install yt-dlp
          yt-dlp -g \
            --add-header "Referer:https://www.facebook.com" \
            --add-header "User-Agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://scontent-sin2-8-xx.fbcdn.cloud/o2/v/t2/f2/m366/42e287ca-40e7-4ffd-bb5d-6a1ec014f404.m3u8"
