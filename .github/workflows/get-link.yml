name: Get Video Link
on: [workflow_dispatch]

jobs:
  get-link:
    runs-on: ubuntu-latest
    steps:
      - name: Get m3u8 content
        run: |
          curl -L \
            -H "Referer: https://www.facebook.com" \
            -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15" \
            "https://scontent-sin2-8-xx.fbcdn.cloud/o2/v/t2/f2/m366/42e287ca-40e7-4ffd-bb5d-6a1ec014f404.m3u8"
